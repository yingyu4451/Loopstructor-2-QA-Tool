name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package, without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @(Get-ChildItem -Path scripts -Filter '*.ps1' -File | Sort-Object Name)) {
            $tokens = $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              throw "PowerShell parse failed for $($script.Name): $($errors -join '; ')"
            }
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Restore desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Cache pinned .NET SDK
        uses: actions/cache@v6
        with:
          path: .dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.config', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME.TrimStart('v') }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate release version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          . ./scripts/common.ps1
          if (-not (Test-CanonicalSemanticVersion -Value $env:PACKAGE_VERSION)) {
            throw "Release version is not a canonical semantic version: $env:PACKAGE_VERSION"
          }
          $checks = [ordered]@{
            'Directory.Build.props' = [regex]::Match((Get-Content 'Directory.Build.props' -Raw), '<VersionPrefix>([^<]+)</VersionPrefix>').Groups[1].Value
            'desktop/package.json' = (Get-Content 'desktop/package.json' -Raw | ConvertFrom-Json).version
            'unity-package/com.loopstructor.qa-editor-bridge/package.json' = (Get-Content 'resources/unity-package/com.loopstructor.qa-editor-bridge/package.json' -Raw | ConvertFrom-Json).version
            'PluginInfo.cs' = [regex]::Match((Get-Content 'src/Loopstructor.AutoPlayer.Plugin/PluginInfo.cs' -Raw), 'Version\s*=\s*"([^"]+)"').Groups[1].Value
          }
          foreach ($entry in $checks.GetEnumerator()) {
            if ($entry.Value -ne $env:PACKAGE_VERSION) {
              throw "Version mismatch: $($entry.Key) declares '$($entry.Value)' but the release tag is '$env:PACKAGE_VERSION'."
            }
          }

      - name: Bootstrap pinned .NET SDK
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Build
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build.ps1 -Configuration Release -Version $env:PACKAGE_VERSION -SkipPnpmInstall

      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -NoRestore -NoBuild

      - name: Electron desktop smoke test
        working-directory: desktop
        shell: pwsh
        run: pnpm exec playwright test

      - name: Package Windows x64 release
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:PACKAGE_VERSION -SkipBuild

      - name: Resolve previous published release for incremental package
        if: github.event_name == 'push'
        id: delta_base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/common.ps1
          if (-not (Test-CanonicalSemanticVersion -Value $env:CURRENT_VERSION)) {
            throw "Current tag is not a canonical semantic version: $env:CURRENT_VERSION"
          }
          $candidates = @(
            git tag --list 'v*' --sort=-version:refname |
              ForEach-Object {
                $tag = $_
                $text = $tag.TrimStart('v')
                if ((Test-CanonicalSemanticVersion -Value $text) -and
                    (Compare-CanonicalSemanticVersion -Left $text -Right $env:CURRENT_VERSION) -lt 0) {
                  [pscustomobject]@{ Tag = $tag; Text = $text }
                }
              }
          )
          foreach ($candidate in $candidates) {
            $releaseJson = gh release view $candidate.Tag --json isDraft,isPrerelease
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not inspect release $($candidate.Tag) (gh exit $LASTEXITCODE); skipping it as an incremental base."
              continue
            }
            $releaseState = $releaseJson | ConvertFrom-Json
            if ([bool]$releaseState.isDraft -or [bool]$releaseState.isPrerelease) {
              continue
            }
            $directory = Join-Path $env:GITHUB_WORKSPACE "artifacts\delta-base\$($candidate.Text)"
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
            $asset = "Loopstructor-2-QA-Tool-$($candidate.Text)-win-x64.zip"
            gh release download $candidate.Tag --pattern $asset --pattern 'autoplayer-update-manifest.json' --dir $directory --clobber
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not download assets for release $($candidate.Tag) (gh exit $LASTEXITCODE); skipping it as an incremental base."
              continue
            }
            try {
              $archive = Join-Path $directory $asset
              $manifestPath = Join-Path $directory 'autoplayer-update-manifest.json'
              $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
              $archiveFile = Get-Item -LiteralPath $archive
              $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ([int]$manifest.schemaVersion -ne 3 -or
                  -not [StringComparer]::Ordinal.Equals([string]$manifest.version, $candidate.Text) -or
                  -not [StringComparer]::Ordinal.Equals([string]$manifest.runtimeIdentifier, 'win-x64') -or
                  -not [StringComparer]::Ordinal.Equals([string]$manifest.assetName, $asset) -or
                  [long]$manifest.size -ne [long]$archiveFile.Length -or
                  -not [StringComparer]::OrdinalIgnoreCase.Equals([string]$manifest.sha256, $archiveHash)) {
                throw "Published manifest does not exactly describe $asset."
              }
              Invoke-DotNet -Arguments @(
                'run',
                '--project', 'src/Loopstructor.AutoPlayer.Updater/Verification/Verification.csproj',
                '--configuration', 'Release',
                '--no-build',
                '--',
                '--verify-release-package', $archive,
                '--expected-version', $candidate.Text)
              "available=true" >> $env:GITHUB_OUTPUT
              "base_archive=$archive" >> $env:GITHUB_OUTPUT
              "base_manifest=$manifestPath" >> $env:GITHUB_OUTPUT
              "base_version=$($candidate.Text)" >> $env:GITHUB_OUTPUT
              exit 0
            }
            catch {
              Write-Warning "Skipping invalid incremental base $($candidate.Tag): $($_.Exception.Message)"
            }
          }
          "available=false" >> $env:GITHUB_OUTPUT
          Write-Host 'No earlier published release with a full package was found; this release will use full-package updates only.'

      - name: Create incremental package
        if: github.event_name == 'push' && steps.delta_base.outputs.available == 'true'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          BASE_ARCHIVE: ${{ steps.delta_base.outputs.base_archive }}
          BASE_MANIFEST: ${{ steps.delta_base.outputs.base_manifest }}
        run: |
          ./scripts/package-delta.ps1 `
            -BaseArchive $env:BASE_ARCHIVE `
            -BaseManifest $env:BASE_MANIFEST `
            -TargetPackageDirectory 'artifacts/package/Loopstructor-2-QA-Tool' `
            -TargetVersion $env:PACKAGE_VERSION `
            -ReleaseDirectory 'artifacts/release'

      - name: Verify release archive layouts
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          DELTA_BASE_AVAILABLE: ${{ steps.delta_base.outputs.available }}
          DELTA_BASE_ARCHIVE: ${{ steps.delta_base.outputs.base_archive }}
        run: |
          $arguments = @{
            Version = $env:PACKAGE_VERSION
          }
          if ($env:DELTA_BASE_AVAILABLE -eq 'true') {
            $arguments.DeltaBaseArchive = $env:DELTA_BASE_ARCHIVE
          }
          ./scripts/verify-release-assets.ps1 @arguments

      - name: Verify runnable staging layout
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\package\Loopstructor-2-QA-Tool'
          $requiredFiles = @(
            'Loopstructor-2-QA-Tool.exe'
            'autoplayer-release.json'
            'checksums.sha256'
            'manager/Loopstructor-2-QA-Tool.exe'
            'manager/resources/app.asar'
            'manager/Loopstructor.AutoPlayer.Host.exe'
            'manager/Loopstructor.AutoPlayer.Host.dll'
            'manager/Loopstructor.AutoPlayer.Host.deps.json'
            'manager/Loopstructor.AutoPlayer.Host.runtimeconfig.json'
            'manager/Loopstructor.AutoPlayer.Updater.exe'
            'manager/Loopstructor.AutoPlayer.Updater.dll'
            'manager/Loopstructor.AutoPlayer.Updater.deps.json'
            'manager/Loopstructor.AutoPlayer.Updater.runtimeconfig.json'
            'manager/coreclr.dll'
            'payload/bepinex/winhttp.dll'
            'payload/bepinex/doorstop_config.ini'
            'payload/bepinex/BepInEx/core/BepInEx.dll'
            'payload/plugin/Loopstructor.AutoPlayer.Plugin.dll'
            'payload/plugin/Loopstructor.AutoPlayer.Core.dll'
            'payload/plugin/Loopstructor.AutoPlayer.Plugin.deps.json'
          )
          foreach ($relativePath in $requiredFiles) {
            $path = Join-Path $artifactRoot $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Workflow artifact is missing required file: $relativePath"
            }
          }

          foreach ($relativePath in @('manager', 'payload')) {
            $path = Join-Path $artifactRoot $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Container)) {
              throw "Workflow artifact is missing root directory: $relativePath"
            }
          }

          if (Test-Path -LiteralPath (Join-Path $artifactRoot 'updater')) {
            throw 'Workflow artifact must not contain the retired updater compatibility directory.'
          }

          $pluginSymbols = @(
            Get-ChildItem -LiteralPath (Join-Path $artifactRoot 'payload\plugin') -Recurse -File |
              Where-Object { $_.Extension -in '.pdb', '.xml' }
          )
          if ($pluginSymbols.Count -ne 0) {
            throw "Workflow artifact must not contain plugin symbol or documentation files: $($pluginSymbols.Name -join ', ')"
          }

          $marker = Get-Content -LiteralPath (Join-Path $artifactRoot 'autoplayer-release.json') -Raw | ConvertFrom-Json
          if ([int]$marker.schemaVersion -ne 2) {
            throw "Workflow artifact release schema is incorrect: $($marker.schemaVersion)"
          }
          if ($marker.managerPath -cne 'Loopstructor-2-QA-Tool.exe') {
            throw "Workflow artifact Manager entry point is not at the root: $($marker.managerPath)"
          }
          if ($marker.updaterPath -cne 'manager/Loopstructor.AutoPlayer.Updater.exe') {
            throw "Workflow artifact Updater entry point is incorrect: $($marker.updaterPath)"
          }

          $nestedProductZips = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter '*.zip')
          if ($nestedProductZips.Count -ne 0) {
            throw "Workflow artifact root must contain runnable files, not a nested product ZIP: $($nestedProductZips.Name -join ', ')"
          }

      - name: Upload runnable program artifact
        uses: actions/upload-artifact@v7
        with:
          name: Loopstructor-2-QA-Tool-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/package/Loopstructor-2-QA-Tool/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release\autoplayer-update-manifest.json'
          $assets = @(
            Get-ChildItem -LiteralPath artifacts/release -File |
              Where-Object { -not [StringComparer]::Ordinal.Equals($_.FullName, $manifest) } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          $releaseJson = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $releaseState = $releaseJson | ConvertFrom-Json
            if (-not [bool]$releaseState.isDraft) {
              throw "Release $env:GITHUB_REF_NAME is already published and will not be overwritten."
            }
            gh release delete $env:GITHUB_REF_NAME --yes
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub stale draft deletion failed with exit code $LASTEXITCODE."
            }
          }
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --generate-notes --title "Loopstructor 2 QA Tool $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub draft release creation failed with exit code $LASTEXITCODE."
          }
          gh release upload $env:GITHUB_REF_NAME @assets
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release asset upload failed with exit code $LASTEXITCODE."
          }
          gh release upload $env:GITHUB_REF_NAME $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release manifest upload failed with exit code $LASTEXITCODE."
          }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE."
          }
